    <!-- Formulario flotante de registro -->
    <div class="registro-flotante">
        <h2>Crear Cuenta</h2>

        <input type="password" placeholder="Contraseña" required>

        <input type="text" placeholder="Licencia de conducción" >
        <input type="text" placeholder="Papeles del vehículo" >

        <label>
            <input type="checkbox" required> Acepto los términos y condiciones
        </label>

        <button onclick="registrar()">Registrarse</button>
    </div>
