<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="../CSS/inicio.css">
</head>

<body>

    <!-- Barra de navegación -->

    <header class="cabezera">
<div class="perfil" onclick="mostrarPanel()">

    <img id="fotoPerfil"
         src="../imagenes/perfil.png"
         alt=""
         width="90px">

    <span id="nombreUsuario"></span>

    <input type="file"
           id="subirFoto"
           accept="image/*"
           capture="user"
           onchange="cambiarFoto(event)"
           hidden>

</div>

        <!-- PANEL -->
        <div id="panelPerfil" class="panelPerfil">
            <button class="cerrarPanel" onclick="cerrarPanel()">X</button>

            <p>
                <strong>Nombre:</strong>
                <span id="infoNombre"></span>
            </p>

            <p>
                <strong>Correo:</strong>
                <span id="infoCorreo"></span>
            </p>

            <p>
                <strong>Telefono:</strong>
                <span id="infoTelefono"></span>
            </p>

        </div>

        <!-- IZQUIERDA -->
        <nav class="izqui">
            <a href="index.html">HOME</a>
            <a href="trayectoria.html">TRAYECTORIA</a>
            <a href="ayuda.html">AYUDA</a>
            <a href="busqueda.html">BUSQUEDA</a>
        </nav>

        <!-- DERECHA -->
        <nav class="dere">
            <a href="inicio.html">INICIO</a>
            <a href="Registro.html">REGISTRO</a>
        </nav>

    </header>

    <!-- LOGIN -->
    <div class="login-flotante">

        <h2>Iniciar Sesión</h2>

        <input type="text" id="nombre" placeholder="Nombre">
        <input type="text" id="telefono" placeholder="Telefono">

        <input type="email" id="correo" placeholder="Correo electrónico">

        <input type="password" id="contraseña" placeholder="Contraseña">

        <a href="#">Recuperar contraseña</a>

        <button onclick="guardarDatos()">Entrar</button>

    </div>


    <script src="../JS/login.js"></script>

</body>

</html>
